<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QuizCore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6f9;
  --white:#ffffff;
  --indigo:#4338ca;
  --indigo2:#5b6ef5;
  --indigo-light:#eef0fd;
  --dark:#111827;
  --text:#374151;
  --muted:#6b7280;
  --border:#e5e7eb;
  --green:#16a34a;
  --green-bg:#dcfce7;
  --red:#dc2626;
  --red-bg:#fee2e2;
  --orange:#d97706;
  --orange-bg:#fef3c7;
  --radius:14px;
  --shadow:0 1px 4px rgba(0,0,0,0.07),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 12px rgba(0,0,0,0.10);
}
html,body{
  height:100%;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.5;
}
.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}

/* ── NAV ── */
.nav{
  background:var(--white);
  border-bottom:1px solid var(--border);
  padding:0 32px;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
  position:sticky;top:0;z-index:50;
}
.nav-left{display:flex;align-items:center;gap:10px}
.nav-logo{
  font-size:19px;font-weight:800;
  color:var(--indigo2);letter-spacing:-0.5px;cursor:pointer;
}
.nav-pill{
  padding:5px 16px;
  background:var(--indigo-light);
  border-radius:20px;
  font-size:13px;font-weight:600;
  color:var(--indigo2);
  cursor:pointer;border:none;
}
.nav-right{display:flex;align-items:center;gap:12px}
.nav-user{font-size:13px;color:var(--dark);font-weight:500}
.nav-user span{color:var(--muted);font-weight:400}
.nav-role{
  padding:4px 12px;
  background:var(--indigo-light);
  border-radius:20px;
  font-size:11px;font-weight:700;
  color:var(--indigo2);letter-spacing:.5px;
}
.nav-logout{
  font-size:13px;color:var(--muted);
  background:none;border:none;cursor:pointer;
  font-weight:500;
  transition:color .2s;
}
.nav-logout:hover{color:var(--dark)}
.nav-timer{
  display:flex;align-items:center;gap:6px;
  font-size:14px;font-weight:600;color:var(--dark);
  background:var(--indigo-light);
  padding:6px 16px;border-radius:8px;
}

/* ── LOGIN ── */
#screen-login,#screen-password{
  align-items:center;justify-content:center;
  background:var(--bg);
}
.login-box{width:100%;max-width:440px;padding:24px}
.login-title{
  font-size:32px;font-weight:800;color:var(--dark);
  text-align:center;margin-bottom:36px;letter-spacing:-0.7px;
}
.login-label{font-size:14px;font-weight:500;color:var(--dark);margin-bottom:6px;display:block}
.login-input{
  width:100%;padding:12px 16px;
  border:1.5px solid var(--border);
  border-radius:10px;font-size:15px;
  color:var(--dark);background:var(--white);
  outline:none;transition:all .2s;
  font-family:inherit;
}
.login-input:focus{border-color:var(--indigo2);box-shadow:0 0 0 3px rgba(91,110,245,0.15)}
.login-input::placeholder{color:#9ca3af}
.login-btn{
  width:100%;padding:13px;margin-top:14px;
  background:var(--indigo2);color:white;
  border:none;border-radius:10px;
  font-size:15px;font-weight:600;
  cursor:pointer;transition:all .2s;
  font-family:inherit;
}
.login-btn:hover{background:var(--indigo);transform:translateY(-1px)}
.login-btn:disabled{background:#a5b4fc;cursor:not-allowed;transform:none}
.login-username-row{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.login-username-val{font-size:15px;font-weight:700;color:var(--dark)}
.login-change{font-size:14px;color:var(--indigo2);background:none;border:none;cursor:pointer;font-weight:500}
.login-change:hover{text-decoration:underline}
.login-error{
  margin-top:10px;padding:10px 14px;
  background:#fee2e2;border-radius:8px;
  font-size:13px;color:var(--red);display:none;
}
.login-error.show{display:block}

/* ── DASHBOARD ── */
#screen-dashboard{background:var(--bg)}
.dash-body{
  flex:1;
  padding:48px 40px;
  max-width:1100px;
  margin:0 auto;width:100%;
}
.dash-title{
  font-size:28px;font-weight:800;
  color:var(--dark);
  margin-bottom:32px;
  letter-spacing:-0.5px;
}
.quiz-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(460px,1fr));
  gap:20px;
}
.quiz-card{
  background:var(--white);
  border-radius:var(--radius);
  padding:28px 28px 24px;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  transition:box-shadow .2s,transform .2s;
  cursor:pointer;
}
.quiz-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.quiz-card-top{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.badge{
  padding:3px 10px;border-radius:6px;
  font-size:11px;font-weight:700;letter-spacing:.4px;
}
.badge-finished{background:var(--green-bg);color:var(--green)}
.badge-available{background:#dbeafe;color:#1d4ed8}
.badge-pts-good{background:var(--green-bg);color:var(--green)}
.badge-pts-bad{background:var(--red-bg);color:var(--red)}
.badge-pts-ok{background:var(--orange-bg);color:var(--orange)}
.quiz-started{font-size:12px;color:var(--muted)}
.quiz-name{
  font-size:20px;font-weight:800;
  color:var(--dark);margin-bottom:5px;
  letter-spacing:-0.4px;
}
.quiz-desc{font-size:13px;color:var(--muted);margin-bottom:0}
/* Card footer: meta left, actions right */
.quiz-card-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:20px;
  gap:12px;
}
.quiz-meta{
  display:flex;align-items:center;gap:18px;
  font-size:13px;color:var(--muted);
}
.quiz-meta-item{display:flex;align-items:center;gap:5px}
.quiz-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.btn-label{
  border:1.5px solid var(--orange);color:var(--orange);
  background:none;border-radius:8px;
  padding:6px 16px;font-size:13px;font-weight:600;
  cursor:pointer;transition:all .2s;font-family:inherit;
}
.btn-label:hover{background:var(--orange-bg)}
.btn-results{
  background:none;color:var(--green);
  border:none;font-weight:700;
  cursor:pointer;font-size:13px;
  padding:6px 0;
}
.btn-results:hover{text-decoration:underline}
.btn-start{
  background:var(--indigo2);color:white;
  padding:8px 20px;border-radius:8px;
  font-size:14px;font-weight:600;
  cursor:pointer;transition:all .2s;
  border:none;font-family:inherit;
}
.btn-start:hover{background:var(--indigo)}

/* ── QUIZ SCREEN ── */
#screen-quiz{background:var(--bg)}
.quiz-body{flex:1;overflow-y:auto;padding:28px 40px}
.quiz-topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px;
}
.q-back{
  display:flex;align-items:center;gap:6px;
  font-size:14px;font-weight:500;color:var(--muted);
  background:none;border:none;cursor:pointer;
  transition:color .2s;font-family:inherit;
}
.q-back:hover{color:var(--dark)}
.q-nav-controls{display:flex;align-items:center;gap:6px}
.q-nav-controls select{
  padding:7px 14px;border:1px solid var(--border);
  border-radius:8px;font-size:13px;font-weight:500;
  background:white;cursor:pointer;outline:none;
  color:var(--dark);min-width:150px;font-family:inherit;
}
.q-nav-btn{
  width:34px;height:34px;border:1px solid var(--border);
  border-radius:8px;background:white;font-size:22px;
  cursor:pointer;color:var(--dark);
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;padding:0;line-height:1;
}
.q-nav-btn:hover{background:var(--indigo-light);border-color:var(--indigo2);color:var(--indigo2)}
.q-nav-btn:disabled{opacity:0.35;cursor:not-allowed}

/* Two-column quiz layout */
.quiz-content{
  display:grid;
  grid-template-columns:1fr 380px;
  gap:16px;
  align-items:start;
  max-width:1140px;
  margin:0 auto;
}
@media(max-width:960px){.quiz-content{grid-template-columns:1fr}.quiz-body{padding:16px}}

.q-card{
  background:var(--white);
  border-radius:var(--radius);
  padding:32px;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
}
.q-title{font-size:22px;font-weight:800;color:var(--dark);margin-bottom:14px;letter-spacing:-0.4px}
.q-type-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.q-type-badge{
  padding:4px 12px;border-radius:6px;
  font-size:12px;font-weight:600;
  display:inline-flex;align-items:center;
}
.badge-fitb{background:#ccfbf1;color:#0f766e}
.badge-mc{background:#dbeafe;color:#1e40af}
.badge-code{background:#f3e8ff;color:#6b21a8}
.badge-sio{background:#dcfce7;color:#15803d}
.badge-timelimit{background:#fef9c3;color:#854d0e}
.q-max{font-size:13px;color:var(--text);font-weight:500}
.q-description{font-size:14px;color:var(--text);margin-bottom:22px;line-height:1.65}

/* Code block */
.code-block{
  background:#0f1117;border-radius:10px;padding:20px;
  font-family:'Fira Code','Courier New',monospace;
  font-size:13px;line-height:1.75;
  overflow-x:auto;margin-bottom:16px;
  border:1px solid #1e2132;
}
.code-line{display:flex;gap:14px}
.code-ln{color:#3a3f55;user-select:none;min-width:18px;text-align:right;flex-shrink:0}
.code-text{color:#c9d1d9;white-space:pre}
.kw{color:#79b8ff}.fn{color:#b392f0}.str{color:#9ecbff}.cm{color:#6a737d}
.blank-highlight{
  display:inline-block;background:#3b5bdb;color:white;
  padding:1px 8px;border-radius:4px;font-size:11px;
  font-weight:700;vertical-align:middle;margin:0 2px;
}

/* MC */
.mc-options{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.mc-option{
  display:flex;align-items:center;gap:14px;
  padding:13px 18px;background:var(--bg);
  border:1.5px solid var(--border);border-radius:10px;
  cursor:pointer;transition:all .2s;
}
.mc-option:hover{border-color:var(--indigo2);background:#eef0fd}
.mc-option.selected{border-color:var(--indigo2);background:#eef0fd}
.mc-radio{
  width:18px;height:18px;border-radius:50%;
  border:2px solid var(--border);flex-shrink:0;
  transition:all .2s;display:flex;align-items:center;justify-content:center;
}
.mc-option.selected .mc-radio{border-color:var(--indigo2);background:var(--indigo2)}
.mc-option.selected .mc-radio::after{content:'';width:6px;height:6px;border-radius:50%;background:white}
.mc-label{font-size:14px;color:var(--dark)}

/* Code input I/O area */
.io-block{
  background:#0f1117;border-radius:8px;padding:14px 18px;
  font-family:'Fira Code','Courier New',monospace;
  font-size:13px;color:#c9d1d9;margin-bottom:12px;
}
.io-label{font-size:13px;font-weight:600;color:var(--dark);margin-bottom:8px}

/* Right panel */
.quiz-right{
  background:var(--white);border-radius:var(--radius);
  padding:26px;border:1px solid var(--border);box-shadow:var(--shadow);
}
.r-title{font-size:14px;font-weight:700;color:var(--dark);margin-bottom:18px}
.blank-input{
  width:100%;padding:11px 14px;
  border:1.5px solid var(--border);border-radius:8px;
  font-size:14px;color:var(--dark);
  background:var(--white);outline:none;
  transition:all .2s;font-family:'Fira Code','Courier New',monospace;
}
.blank-input:focus{border-color:var(--indigo2);box-shadow:0 0 0 3px rgba(91,110,245,0.12)}
.submit-ans-btn{
  width:100%;padding:13px;margin-top:22px;
  background:var(--indigo2);color:white;border:none;
  border-radius:10px;font-size:14px;font-weight:600;
  cursor:pointer;transition:all .2s;font-family:inherit;
}
.submit-ans-btn:hover{background:var(--indigo)}

/* Code editor */
.code-editor{
  width:100%;height:240px;
  background:#0f1117;color:#c9d1d9;
  border:1px solid #1e2132;border-radius:8px;
  padding:16px;
  font-family:'Fira Code','Courier New',monospace;
  font-size:13px;line-height:1.7;resize:vertical;outline:none;
}
.code-editor:focus{border-color:#4a4a7a}
.editor-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;background:#080a10;
  border-bottom:1px solid #1e2132;border-radius:8px 8px 0 0;
}
.editor-wrap{border:1px solid #1e2132;border-radius:8px;overflow:hidden}
.editor-wrap .code-editor{border:none;border-radius:0;height:240px}
.btn-run{
  padding:11px;background:#1f2937;color:white;
  border:none;border-radius:8px;
  font-size:13px;font-weight:600;cursor:pointer;
  transition:background .2s;font-family:inherit;
}
.btn-run:hover{background:#111827}
.btn-submit-code{
  padding:11px;background:var(--indigo2);color:white;
  border:none;border-radius:8px;
  font-size:13px;font-weight:600;cursor:pointer;
  transition:background .2s;font-family:inherit;
}
.btn-submit-code:hover{background:var(--indigo)}
.output-box{
  margin-top:14px;background:var(--white);
  border:1px solid var(--border);border-radius:10px;padding:16px;
}
.status-success{
  padding:3px 10px;background:var(--green-bg);color:var(--green);
  border-radius:6px;font-size:12px;font-weight:700;
}

/* ── RESULTS ── */
#screen-results{background:var(--bg)}
.results-body{flex:1;padding:40px 32px;max-width:860px;margin:0 auto;width:100%}
.results-back{
  display:flex;align-items:center;gap:6px;
  font-size:14px;font-weight:600;color:var(--dark);
  background:none;border:none;cursor:pointer;
  margin-bottom:28px;transition:color .2s;font-family:inherit;
}
.results-back:hover{color:var(--indigo)}
.results-card{
  background:var(--white);border-radius:var(--radius);
  padding:32px;border:1px solid var(--border);box-shadow:var(--shadow);
}
.results-quiz-name{font-size:18px;font-weight:700;color:var(--dark);margin-bottom:24px}
.score-box{
  background:var(--bg);border-radius:12px;padding:28px;
  text-align:center;margin-bottom:24px;
}
.score-label{font-size:14px;color:var(--muted);margin-bottom:10px}
.score-num{font-size:54px;font-weight:800;letter-spacing:-2px;line-height:1;margin-bottom:6px}
.score-pct{font-size:16px;color:var(--muted);font-weight:500;margin-bottom:18px}
.score-bar-wrap{background:#e5e7eb;border-radius:99px;height:8px;overflow:hidden}
.score-bar{height:100%;border-radius:99px;transition:width 1s ease}
.answers-list{margin-top:24px;display:flex;flex-direction:column;gap:10px}
.answer-row{
  background:var(--bg);border-radius:10px;
  padding:16px;border:1px solid var(--border);
}
.answer-q{font-size:13px;font-weight:600;color:var(--dark);margin-bottom:6px}
.answer-detail{font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}

@media(max-width:768px){
  .quiz-grid{grid-template-columns:1fr}
  .dash-body,.results-body{padding:20px 16px}
  .nav{padding:0 16px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="screen-login" class="screen active">
  <div class="login-box">
    <h1 class="login-title">Sign in to QuizCore</h1>
    <div style="margin-bottom:16px">
      <label class="login-label">Username / ID</label>
      <input class="login-input" id="loginUsername" type="text" placeholder="Enter your username or student ID" autocomplete="off"/>
    </div>
    <div class="login-error" id="loginError">Please enter your username or ID</div>
    <button class="login-btn" onclick="goToPassword()">Continue</button>
  </div>
</div>

<!-- PASSWORD -->
<div id="screen-password" class="screen">
  <div class="login-box">
    <h1 class="login-title">Sign in to QuizCore</h1>
    <div style="margin-bottom:8px">
      <div class="login-label">Username</div>
      <div class="login-username-row">
        <span class="login-username-val" id="displayUsername"></span>
        <button class="login-change" onclick="goBack()">Change</button>
      </div>
    </div>
    <div>
      <label class="login-label">Password</label>
      <input class="login-input" id="loginPassword" type="password" placeholder="Enter your password" autocomplete="current-password"/>
    </div>
    <div class="login-error" id="passError">Incorrect password.</div>
    <button class="login-btn" onclick="doLogin()">Sign in</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="screen-dashboard" class="screen">
  <nav class="nav">
    <div class="nav-left">
      <div class="nav-logo">QuizCore</div>
      <button class="nav-pill">Quizzes</button>
    </div>
    <div class="nav-right">
      <span class="nav-user" id="dashUser"></span>
      <span class="nav-role">STUDENT</span>
      <button class="nav-logout" onclick="logout()">Logout</button>
    </div>
  </nav>
  <div class="dash-body">
    <h2 class="dash-title">Available Quizzes</h2>
    <div class="quiz-grid" id="quizGrid"></div>
  </div>
</div>

<!-- QUIZ TAKING -->
<div id="screen-quiz" class="screen">
  <nav class="nav">
    <div class="nav-left">
      <div class="nav-logo">QuizCore</div>
    </div>
    <div class="nav-right">
      <div class="nav-timer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="timerDisplay">90:00</span>
      </div>
      <span class="nav-user" id="quizUser"></span>
    </div>
  </nav>
  <div class="quiz-body">
    <div class="quiz-topbar">
      <button class="q-back" onclick="backToDash()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Back to quiz
      </button>
      <div class="q-nav-controls">
        <select id="questionSelectNav" onchange="jumpToQuestion(this.value)"></select>
        <button class="q-nav-btn" id="btnPrev" onclick="prevQuestion()">&#8249;</button>
        <button class="q-nav-btn" id="btnNext" onclick="nextQuestion()">&#8250;</button>
      </div>
    </div>
    <div class="quiz-content">
      <div class="q-card" id="questionCard"></div>
      <div class="quiz-right" id="quizRightPanel"></div>
    </div>
  </div>
</div>

<!-- RESULTS -->
<div id="screen-results" class="screen">
  <nav class="nav">
    <div class="nav-left">
      <div class="nav-logo">QuizCore</div>
      <button class="nav-pill">Quizzes</button>
    </div>
    <div class="nav-right">
      <span class="nav-user" id="resultsUser"></span>
      <span class="nav-role">STUDENT</span>
      <button class="nav-logout" onclick="logout()">Logout</button>
    </div>
  </nav>
  <div class="results-body">
    <button class="results-back" onclick="backToDash()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Quiz Results
    </button>
    <div class="results-card" id="resultsCard"></div>
  </div>
</div>

// ── STATE ─────────────────────────────────────────────────────
let state = {
  user: null,
  currentQuiz: null,
  currentQIdx: 0,
  answers: {},
  timer: null,
  timeLeft: 0,
};

// ── HELPERS ───────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}
function $(id) { return document.getElementById(id); }
function ptsColor(e, t) {
  const p = e / t;
  return p >= 0.8 ? 'badge-pts-good' : p >= 0.5 ? 'badge-pts-ok' : 'badge-pts-bad';
}

// ── AUTH ──────────────────────────────────────────────────────
function goToPassword() {
  const val = $('loginUsername').value.trim();
  if (!val) { $('loginError').classList.add('show'); return; }
  $('loginError').classList.remove('show');
  $('displayUsername').textContent = val;
  $('loginPassword').value = '';
  $('passError').classList.remove('show');
  showScreen('password');
  setTimeout(() => $('loginPassword').focus(), 100);
}
function goBack() { showScreen('login'); setTimeout(() => $('loginUsername').focus(), 100); }
function doLogin() {
  const id = $('loginUsername').value.trim();
  const pw = $('loginPassword').value;
  const user = USERS[id];
  if (!user || user.password !== pw) { $('passError').classList.add('show'); return; }
  $('passError').classList.remove('show');
  state.user = user;
  renderDashboard();
  showScreen('dashboard');
}
function logout() {
  clearInterval(state.timer);
  state = { user: null, currentQuiz: null, currentQIdx: 0, answers: {}, timer: null, timeLeft: 0 };
  $('loginUsername').value = '';
  $('loginPassword').value = '';
  showScreen('login');
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const active = document.querySelector('.screen.active');
  if (active.id === 'screen-login') goToPassword();
  if (active.id === 'screen-password') doLogin();
});

// ── DASHBOARD ─────────────────────────────────────────────────
function renderDashboard() {
  const u = state.user;
  $('dashUser').innerHTML = `${u.name} <span>(${u.id})</span>`;
  $('quizGrid').innerHTML = QUIZZES.map(q => {
    const fin = q.status === 'finished';
    return `<div class="quiz-card" onclick="openQuiz('${q.id}')">
      <div class="quiz-card-top">
        <span class="badge ${fin ? 'badge-finished' : 'badge-available'}">${fin ? 'FINISHED' : 'AVAILABLE'}</span>
        ${fin ? `<span class="badge ${ptsColor(q.earnedPts, q.totalPts)}">${q.earnedPts}/${q.totalPts} PTS</span>` : ''}
        ${fin ? `<span class="quiz-started">STARTED: ${q.startedAt}</span>` : ''}
      </div>
      <div class="quiz-name">${q.title}</div>
      <div class="quiz-desc">${q.description}</div>
      <div class="quiz-card-footer">
        <div class="quiz-meta">
          <div class="quiz-meta-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            ${q.duration} min
          </div>
          <div class="quiz-meta-item">${q.questions.length} questions</div>
        </div>
        <div class="quiz-actions">
          ${fin
            ? `<button class="btn-label" onclick="event.stopPropagation();viewResults('${q.id}')">${q.label}</button>
               <button class="btn-results" onclick="event.stopPropagation();viewResults('${q.id}')">Results</button>`
            : `<button class="btn-start" onclick="event.stopPropagation();startQuiz('${q.id}')">Start Quiz →</button>`
          }
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── QUIZ ──────────────────────────────────────────────────────
function openQuiz(qid) {
  const quiz = QUIZZES.find(q => q.id === qid);
  if (quiz.status === 'finished') { viewResults(qid); return; }
  startQuiz(qid);
}

function startQuiz(qid) {
  const quiz = QUIZZES.find(q => q.id === qid);
  state.currentQuiz = quiz;
  state.currentQIdx = 0;
  state.answers = {};
  state.timeLeft = quiz.duration * 60;
  const u = state.user;
  $('quizUser').innerHTML = `${u.name} <span>(${u.id})</span>`;
  const opts = quiz.questions.map((q, i) =>
    `<option value="${i}">Question ${i + 1}${i === state.currentQIdx ? '' : ''}</option>`
  ).join('');
  $('questionSelectNav').innerHTML = opts;
  renderQuestion();
  startTimer();
  showScreen('quiz');
}

function renderQuestion() {
  const q = state.currentQuiz.questions[state.currentQIdx];
  syncSelectors();
  renderQuestionCard(q);
  renderRightPanel(q);
  window.scrollTo(0, 0);
}
function jumpToQuestion(idx) { state.currentQIdx = parseInt(idx); renderQuestion(); }
function prevQuestion() { if (state.currentQIdx > 0) { state.currentQIdx--; renderQuestion(); } }
function nextQuestion() {
  if (state.currentQIdx < state.currentQuiz.questions.length - 1) { state.currentQIdx++; renderQuestion(); }
}
function syncSelectors() {
  const s = $('questionSelectNav'); if (s) s.value = state.currentQIdx;
  const p = $('btnPrev'); if (p) p.disabled = state.currentQIdx === 0;
  const n = $('btnNext'); if (n) n.disabled = state.currentQIdx === state.currentQuiz.questions.length - 1;
}

function renderQuestionCard(q) {
  const typeLabel = { fitb: 'Fill in the Blanks', mc: 'Multiple Choice', code: 'Coding' };
  const typeBadge = { fitb: 'badge-fitb', mc: 'badge-mc', code: 'badge-code' };

  let html = `
    <div class="q-title">${q.title}</div>
    <div class="q-type-row">
      <span class="q-type-badge ${typeBadge[q.type]}">${typeLabel[q.type]}</span>
      ${q.lang ? `<span class="q-type-badge badge-mc">${q.lang}</span>` : ''}
      ${q.subtype ? `<span class="q-type-badge badge-sio">${q.subtype}</span>` : ''}
      ${q.timeLimit ? `<span class="q-type-badge badge-timelimit">Time limit: ${q.timeLimit}ms</span>` : ''}
      <span class="q-max">Max score: ${q.maxScore}</span>
    </div>
    <div class="q-description">${q.description}</div>`;

  if (q.type === 'fitb') {
    html += renderCodeBlock(q);
    if (q.note) html += `<div style="margin-top:12px;font-size:13px;color:var(--text)">${q.note}</div>`;
  }

  if (q.type === 'mc') {
    const saved = state.answers[q.id];
    html += `<div class="mc-options">` +
      q.options.map((opt, i) => `
        <div class="mc-option ${saved === i ? 'selected' : ''}" onclick="selectMC('${q.id}',${i})">
          <div class="mc-radio"></div>
          <div class="mc-label">${opt}</div>
        </div>`
      ).join('') + `</div>`;
  }

  if (q.type === 'code') {
    html += `
      <div style="font-size:14px;line-height:1.8;color:var(--text)">
        <p style="margin-bottom:8px"><strong>Input:</strong> ${q.inputDesc || ''}</p>
        <p style="margin-bottom:18px"><strong>Output:</strong> ${q.outputDesc || ''}</p>
        <p style="font-weight:700;margin-bottom:8px">Example:</p>
        <div class="io-label">Input:</div>
        <div class="io-block">${q.inputExample}</div>
        <div class="io-label">Output:</div>
        <div class="io-block">${q.outputExample}</div>
      </div>`;
  }

  $('questionCard').innerHTML = html;
}

function renderCodeBlock(q) {
  let html = '<div class="code-block">';
  q.code.forEach((line, ln) => {
    if (!line.text) {
      html += '<div class="code-line"><span class="code-ln">&nbsp;</span><span class="code-text"> </span></div>';
      return;
    }
    let text = line.text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    text = text.replace(/__BLANK(\d+)__/g, (_, n) =>
      `<span class="blank-highlight">blank ${n}</span>`);
    text = text
      .replace(/\b(class|def|self|return|if|for|from|import|True|False|None|in|as|and|or|not)\b/g, '<span class="kw">$1</span>')
      .replace(/(#[^\n<]*)/g, '<span class="cm">$1</span>');
    html += `<div class="code-line"><span class="code-ln">${ln + 1}</span><span class="code-text">${text}</span></div>`;
  });
  return html + '</div>';
}

function renderRightPanel(q) {
  const panel = $('quizRightPanel');

  if (q.type === 'fitb') {
    const saved = state.answers[q.id] || {};
    let html = `<div class="r-title">Fill in the blanks:</div>`;
    q.blanks.forEach((label, i) => {
      const n = i + 1;
      const val = saved[n] || '';
      html += `<div style="margin-bottom:18px">
        <div style="font-size:13px;font-weight:600;color:var(--dark);margin-bottom:8px">${label}</div>
        <input class="blank-input" id="blank_${n}" value="${val}"
          placeholder="Enter answer for ${label.toLowerCase()}"
          oninput="saveFITB('${q.id}',${n},this.value)"
          onfocus="this.style.borderColor='var(--indigo2)'"
          onblur="this.style.borderColor='var(--border)'"/>
      </div>`;
    });
    html += `<button onclick="submitQuestion()" class="submit-ans-btn">Submit Answers</button>`;
    panel.innerHTML = html;
    return;
  }

  if (q.type === 'mc') {
    panel.innerHTML = `
      <div class="r-title">Choose one answer:</div>
      <p style="font-size:13px;color:var(--muted);line-height:1.65;margin-bottom:20px">
        Select the best answer from the options on the left, then click Submit.
      </p>
      <button class="submit-ans-btn" onclick="submitQuestion()">Submit Answer</button>`;
  }

  if (q.type === 'code') {
    const saved = state.answers[q.id];
    const code = saved?.code || q.starterCode || '';
    panel.innerHTML = `
      <div class="r-title">Code Editor</div>
      <div class="editor-wrap">
        <div class="editor-header">
          <span style="font-size:11px;color:#6c7086;font-family:monospace">${q.lang || 'javascript'}</span>
          <span style="font-size:11px;color:#6c7086">Time limit: ${q.timeLimit || 5000}ms</span>
        </div>
        <textarea class="code-editor" id="codeEditor" spellcheck="false">${code}</textarea>
      </div>
      <div style="margin-top:14px">
        <div style="font-size:13px;font-weight:600;color:var(--dark);margin-bottom:8px">Custom Input</div>
        <textarea id="customInput" style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:'Fira Code','Courier New',monospace;resize:vertical;min-height:80px;outline:none;color:var(--dark);background:white;transition:border-color .2s"
          onfocus="this.style.borderColor='var(--indigo2)'"
          onblur="this.style.borderColor='var(--border)'">${q.inputExample || ''}</textarea>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
        <button class="btn-run" onclick="runCode('${q.id}')">Run</button>
        <button class="btn-submit-code" onclick="submitCode('${q.id}')">Submit</button>
      </div>
      <div id="outputBox" style="display:none;margin-top:14px;background:white;border:1px solid var(--border);border-radius:10px;padding:16px">
        <div style="font-size:13px;font-weight:600;color:var(--dark);margin-bottom:8px">Output</div>
        <div id="outputInner"></div>
      </div>`;
  }
}

function selectMC(qid, idx) {
  state.answers[qid] = idx;
  const q = state.currentQuiz.questions.find(q => q.id === qid);
  renderQuestionCard(q);
}
function saveFITB(qid, n, val) {
  if (!state.answers[qid]) state.answers[qid] = {};
  state.answers[qid][n] = val;
}
function submitQuestion() {
  const quiz = state.currentQuiz;
  if (state.currentQIdx < quiz.questions.length - 1) {
    state.currentQIdx++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}
function runCode(qid) {
  const code = $('codeEditor').value;
  if (!state.answers[qid]) state.answers[qid] = {};
  state.answers[qid].code = code;
  const box = $('outputBox');
  box.style.display = 'block';
  const ms = Math.floor(Math.random() * 50 + 10);
  $('outputInner').innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span class="status-success">Success</span>
      <span style="font-size:12px;color:var(--muted)">${ms}ms</span>
    </div>
    <div style="font-family:'Fira Code','Courier New',monospace;font-size:14px;color:var(--dark)">
      (simulated output)
    </div>`;
}
function submitCode(qid) {
  const code = $('codeEditor').value;
  if (!state.answers[qid]) state.answers[qid] = {};
  state.answers[qid].code = code;
  state.answers[qid].submitted = true;
  submitQuestion();
}
function finishQuiz() {
  clearInterval(state.timer);
  viewResults(state.currentQuiz.id);
}
function backToDash() {
  clearInterval(state.timer);
  renderDashboard();
  showScreen('dashboard');
}

// ── TIMER ─────────────────────────────────────────────────────
function startTimer() {
  clearInterval(state.timer);
  updateTimer();
  state.timer = setInterval(() => {
    state.timeLeft--;
    updateTimer();
    if (state.timeLeft <= 0) { clearInterval(state.timer); finishQuiz(); }
  }, 1000);
}
function updateTimer() {
  const m = Math.floor(state.timeLeft / 60).toString().padStart(2, '0');
  const s = (state.timeLeft % 60).toString().padStart(2, '0');
  $('timerDisplay').textContent = `${m}:${s}`;
  $('timerDisplay').style.color = state.timeLeft < 300 ? 'var(--red)' : 'var(--dark)';
}

// ── RESULTS ───────────────────────────────────────────────────
function viewResults(qid) {
  const quiz = QUIZZES.find(q => q.id === qid);
  const u = state.user;
  $('resultsUser').innerHTML = u ? `${u.name} <span>(${u.id})</span>` : '';

  const earned = quiz.earnedPts !== null ? quiz.earnedPts : Math.floor(quiz.totalPts * 0.7);
  const total = quiz.totalPts;
  const pct = Math.round(earned / total * 100);
  const color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--orange)' : 'var(--red)';
  const barColor = pct >= 80 ? '#16a34a' : pct >= 50 ? '#d97706' : '#dc2626';

  let answersHtml = '<div class="answers-list">';
  quiz.questions.forEach((q, i) => {
    answersHtml += `<div class="answer-row">
      <div class="answer-q">Q${i + 1}: ${q.title}</div>
      <div class="answer-detail">
        <span>${q.type === 'fitb' ? 'Fill in Blanks' : q.type === 'mc' ? 'Multiple Choice' : 'Coding'}</span>
        <span>Max: ${q.maxScore} pts</span>
      </div>
    </div>`;
  });
  answersHtml += '</div>';

  $('resultsCard').innerHTML = `
    <div class="results-quiz-name">${quiz.title}</div>
    <div class="score-box">
      <div class="score-label">Your Score</div>
      <div class="score-num" style="color:${color}">${earned}/${total}</div>
      <div class="score-pct">${pct}%</div>
      <div class="score-bar-wrap">
        <div class="score-bar" style="width:${pct}%;background:${barColor}"></div>
      </div>
    </div>
    ${answersHtml}`;

  showScreen('results');
}

// ── INIT ──────────────────────────────────────────────────────
$('loginUsername').focus();
</script>
</body>
</html>
