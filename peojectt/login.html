<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="Ola Cafe — авторская грузинская кухня в Алматы. Меню, заказ и бронь стола онлайн."/>
<meta name="theme-color" content="#f4f1eb"/>
<title>Вход · Ola Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<body data-root="" data-page="login">
<div id="loader"></div>
<div class="toast" id="toast"></div>
<header id="top"></header>
<main>
<div class="page active"><div class="auth-wrap"><form id="logForm" class="auth-card" novalidate>
  <h1 class="sec-title">С <em>возвращением</em></h1><p class="auth-sub">Войдите, чтобы заказывать и бронировать столы.</p>
  <div id="note"></div>
  <div class="form-sec"><label class="form-label" for="logEmail">Email</label><input class="form-input" id="logEmail" type="email" placeholder="name@mail.com" autocomplete="username"/></div>
  <div class="form-sec"><label class="form-label" for="logPass">Пароль</label><input class="form-input" id="logPass" type="password" placeholder="•••••••••" autocomplete="current-password"/></div>
  <button class="btn btn-primary btn-full" type="submit">Войти</button>
  <p class="auth-links">Нет аккаунта? <a class="lnk" href="register.html">Зарегистрироваться</a></p>
  <p class="demo-note">Демо-доступ<br/>Админ: admin@olacafe.kz / admin123<br/>Гость: aigerim@mail.com / demo123</p>
</form></div></div>
</main>
<footer class="site-footer" id="foot"></footer>
<nav class="bnav" id="bnav"></nav>
<script src="js/config.js"></script><script src="js/db.js"></script><script src="js/validation.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script src="js/client.js"></script><script src="js/i18n.js"></script>
