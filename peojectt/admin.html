<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="Ola Cafe — авторская грузинская кухня в Алматы. Меню, заказ и бронь стола онлайн."/>
<meta name="theme-color" content="#f4f1eb"/>
<title>Панель управления · Ola Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="icon" href="images/logo.svg"/>
<link rel="stylesheet" href="css/styles.css"/>
<link rel="stylesheet" href="css/pages.css"/>
</head>
<body data-root="" data-page="admin" data-auth="admin">
<div id="loader"></div>
<div class="toast" id="toast"></div>
<header id="top"></header>
<main>
<div class="page active"><div class="admin-intro wrap"><div class="eyebrow">Только для персонала</div><h1 class="sec-title">Панель <em>управления</em></h1></div>
<div class="admin-body">
  <div class="admin-tabs" style="margin-top:14px">
    <button class="admin-tab" onclick="switchTab('overview')">📊 Обзор</button>
    <button class="admin-tab" onclick="switchTab('orders')">📋 Заказы</button>
    <button class="admin-tab" onclick="switchTab('menu')">🍽 Меню</button>
    <button class="admin-tab" onclick="switchTab('reservations')">📅 Брони</button>
    <button class="admin-tab" onclick="switchTab('users')">👥 Пользователи</button>
    <button class="admin-tab" onclick="switchTab('returns')">↩ Возвраты</button>
    <button class="admin-tab" onclick="switchTab('waiters')">👤 Официанты</button>
  </div>
  <div class="admin-panel" id="tab-overview"><div id="overviewWrap"></div></div>
  <div class="admin-panel" id="tab-orders"><div style="font-size:12px;color:var(--muted);margin-bottom:14px">История заказов — по дням. Статус меняется прямо в карточке.</div><div id="ordersWrap"></div></div>
  <div class="admin-panel" id="tab-menu"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><div style="font-size:12px;color:var(--muted)">Управление блюдами</div><button onclick="openAddDish()" class="btn btn-primary" style="padding:10px 18px;font-size:11px;letter-spacing:1px">+ Добавить</button></div><div id="menuList"></div></div>
  <div class="admin-panel" id="tab-reservations"><div style="font-size:12px;color:var(--muted);margin-bottom:14px">Брони столиков</div><div id="reservationsWrap"></div></div>
  <div class="admin-panel" id="tab-users"><div style="font-size:12px;color:var(--muted);margin-bottom:14px">Зарегистрированные пользователи</div><div id="usersWrap"></div></div>
  <div class="admin-panel" id="tab-returns"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><div style="font-size:12px;color:var(--muted)">История возвратов</div><button onclick="openReturnModal('','','999999')" class="btn btn-primary" style="padding:10px 18px;font-size:11px;letter-spacing:1px">+ Возврат</button></div><div id="returnsWrap"></div></div>
  <div class="admin-panel" id="tab-waiters"><div style="font-size:12px;color:var(--muted);margin-bottom:14px">Выручка по официантам</div><div id="waitersWrap"></div></div>
</div></div>
<div class="modal-bg" id="dishModal" onclick="handleBg(event,'dishModal')"><div class="modal-box"><div class="modal-handle"></div><button class="modal-close" aria-label="Закрыть" onclick="closeModal('dishModal')">✕</button><div class="modal-title" id="dishFormTitle">Новое блюдо</div>
  <input type="hidden" id="editDishId"/><input type="hidden" id="existingPhoto"/>
  <div class="photo-upload" onclick="$('photoInput').click()"><img class="photo-preview" id="photoPreview" src="" alt=""/><div id="photoUploadContent"><div class="photo-upload-icon">📷</div><div class="photo-upload-hint">Нажмите для загрузки фото (необязательно)</div></div></div>
  <input type="file" id="photoInput" accept="image/*" onchange="onPhotoSelected(this)" style="display:none"/>
  <div class="form-sec"><label class="form-label" for="fName">Название *</label><input class="form-input" id="fName" placeholder="Название блюда"/></div>
  <div class="form-sec"><label class="form-label" for="fDesc">Описание</label><textarea class="form-input" id="fDesc" placeholder="Состав, описание..." style="min-height:68px"></textarea></div>
  <div class="form-row"><div class="form-sec"><label class="form-label" for="fPrice">Цена (₸) *</label><input class="form-input" id="fPrice" type="number" placeholder="2500"/></div><div class="form-sec"><label class="form-label" for="fWeight">Вес / объём</label><input class="form-input" id="fWeight" placeholder="250 г"/></div></div>
  <div class="form-row"><div class="form-sec"><label class="form-label" for="fCat">Категория</label><select class="form-select" id="fCat"><option value="dishes">Блюда</option><option value="drinks">Напитки</option><option value="desserts">Десерты</option><option value="combo">Комбо</option><option value="seasonal">Сезонное</option></select></div><div class="form-sec"><label class="form-label" for="fEmoji">Эмодзи</label><input class="form-input" id="fEmoji" placeholder="🫕"/></div></div>
  <div class="form-sec"><label class="form-label" for="fFeatures">Особенности (через запятую)</label><input class="form-input" id="fFeatures" placeholder="Без глютена, Острое, Хит"/></div>
  <button class="btn btn-primary btn-full" id="saveDishBtn" onclick="saveDish()">Сохранить</button><button class="btn-ghost" onclick="closeModal('dishModal')">Отмена</button></div></div>
<div class="modal-bg" id="returnModal" onclick="handleBg(event,'returnModal')"><div class="modal-box"><div class="modal-handle"></div><button class="modal-close" aria-label="Закрыть" onclick="closeModal('returnModal')">✕</button><div class="modal-title">Оформить возврат</div>
  <input type="hidden" id="returnOrderId"/><input type="hidden" id="returnTableNum"/><input type="hidden" id="returnMaxAmt"/>
  <div class="form-sec"><label class="form-label" for="returnAmount">Сумма возврата (₸)</label><input class="form-input" id="returnAmount" type="number" min="1" placeholder="1500"/></div>
  <div class="form-sec"><label class="form-label" for="returnReason">Причина</label><input class="form-input" id="returnReason" placeholder="Не то блюдо / холодное..."/></div>
  <div class="form-sec"><label class="form-label" for="returnItems">Что возвращают (необязательно)</label><input class="form-input" id="returnItems" placeholder="Хинкали × 2"/></div>
  <button class="btn btn-primary btn-full" onclick="submitReturn()">Оформить возврат</button><button class="btn-ghost" onclick="closeModal('returnModal')">Отмена</button></div></div>
</main>
<footer class="site-footer" id="foot"></footer>
<nav class="bnav" id="bnav"></nav>
<script src="js/config.js"></script><script src="js/db.js"></script><script src="js/validation.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script src="js/admin.js"></script><script src="js/i18n.js"></script>
</body>
</html>
