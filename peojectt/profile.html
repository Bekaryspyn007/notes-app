<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="Ola Cafe — авторская грузинская кухня в Алматы. Меню, заказ и бронь стола онлайн."/>
<meta name="theme-color" content="#f4f1eb"/>
<title>Мой кабинет · Ola Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="icon" href="images/logo.svg"/>
<link rel="stylesheet" href="css/styles.css"/>
<link rel="stylesheet" href="css/pages.css"/>
</head>
<body data-root="" data-page="profile" data-auth="user">
<div id="loader"></div>
<div class="toast" id="toast"></div>
<header id="top"></header>
<main>
<div class="page active"><div class="wrap"><div class="sec-head"><div class="eyebrow">Личный кабинет</div><h1 class="sec-title">Мой <em>профиль</em></h1></div>
  <div class="profile-grid">
    <div><div class="p-card"><div class="p-avatar" id="pAvatar"></div><div id="pInfo"></div>
      <button class="btn btn-primary" id="editBtn">Редактировать профиль</button>
      <form id="editForm" class="hidden" novalidate>
        <div class="form-sec"><label class="form-label" for="efFirst">Имя</label><input class="form-input" id="efFirst" type="text"/></div>
        <div class="form-sec"><label class="form-label" for="efLast">Фамилия</label><input class="form-input" id="efLast" type="text"/></div>
        <div class="form-sec"><label class="form-label" for="efPhone">Телефон</label><input class="form-input" id="efPhone" type="tel"/></div>
        <div class="form-sec"><label class="form-label" for="efDob">Дата рождения</label><input class="form-input" id="efDob" type="date"/></div>
        <button class="btn btn-primary" type="submit">Сохранить</button></form>
      <button class="btn btn-ghost" onclick="logout()">Выйти из аккаунта</button></div></div>
    <div><div class="p-kpis" id="pKpis"></div>
      <h2 class="p-h">Мои заказы</h2><div id="pOrders"></div>
      <h2 class="p-h">Мои брони</h2><div id="pRes"></div>
      <div class="hero-cta"><a class="btn btn-primary" href="pages/menu.html">Новый заказ</a><a class="btn btn-ghost" style="width:auto;display:inline-flex;margin:0" href="pages/reserve.html">Забронировать стол</a></div></div>
  </div></div></div>
</main>
<footer class="site-footer" id="foot"></footer>
<nav class="bnav" id="bnav"></nav>
<script src="js/config.js"></script><script src="js/db.js"></script><script src="js/validation.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script src="js/client.js"></script><script src="js/i18n.js"></script>
</body>
</html>
