<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="Ola Cafe — авторская грузинская кухня в Алматы. Меню, заказ и бронь стола онлайн."/>
<meta name="theme-color" content="#f4f1eb"/>
<title>Оформление заказа · Ola Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="icon" href="../images/logo.svg"/>
<link rel="stylesheet" href="../css/styles.css"/>
<link rel="stylesheet" href="../css/pages.css"/>
</head>
<body data-root="../" data-page="order" data-auth="user">
<div id="loader"></div>
<div class="toast" id="toast"></div>
<header id="top"></header>
<main>
<div class="page active"><div class="narrow"><div class="order-wrap">
  <div class="sec-head" style="padding:0 0 22px"><div class="eyebrow">Оформление</div><h1 class="sec-title">Ваш <em>заказ</em></h1></div>
  <div class="order-summary" id="orderSummary"></div>
  <div class="form-sec"><label class="form-label" for="tableNum">Номер стола</label><input class="form-input" id="tableNum" type="number" min="1" max="99" placeholder="Введите номер стола"/></div>
  <div class="form-sec"><label class="form-label">Ваш официант</label><div class="waiter-select-wrap" id="waiterBtns"></div><input type="hidden" id="waiterSelect"/></div>
  <div class="form-sec"><label class="form-label" for="orderComment">Комментарий к заказу</label><textarea class="form-input" id="orderComment" placeholder="Пожелания, аллергии..."></textarea></div>
  <button class="btn btn-primary btn-full" id="submitOrderBtn" onclick="submitOrder()">Отправить заказ</button>
  <a class="btn-ghost" style="display:flex;justify-content:center" href="cart.html">← Вернуться в корзину</a>
</div></div></div>
</main>
<footer class="site-footer" id="foot"></footer>
<nav class="bnav" id="bnav"></nav>
<script src="../js/config.js"></script><script src="../js/db.js"></script><script src="../js/validation.js"></script><script src="../js/auth.js"></script><script src="../js/layout.js"></script><script src="../js/client.js"></script><script src="../js/i18n.js"></script>
</body>
</html>
