<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YAMAL</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0a0f;
  --bg2:rgba(255,255,255,0.04);
  --bg3:rgba(255,255,255,0.07);
  --bg4:rgba(255,255,255,0.1);
  --glass:rgba(255,255,255,0.06);
  --glass-border:rgba(255,255,255,0.12);
  --glass-strong:rgba(255,255,255,0.1);
  --text:#f0f0f0;
  --text2:rgba(255,255,255,0.55);
  --text3:rgba(255,255,255,0.3);
  --accent:#f5a623;
  --accent2:#e8940f;
  --green:#22c55e;
  --red:#ef4444;
  --blue:#60a5fa;
  --purple:#c084fc;
  --nav-h:64px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',sans-serif;
  display:flex;
  flex-direction:column;
}

/* LIQUID GLASS MIXIN */
.glass{
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--glass-border);
}
.glass-strong{
  background:var(--glass-strong);
  backdrop-filter:blur(32px) saturate(200%);
  -webkit-backdrop-filter:blur(32px) saturate(200%);
  border:1px solid rgba(255,255,255,0.18);
}

/* BG ORBS */
body::before,body::after{
  content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;
}
body::before{
  width:400px;height:400px;
  background:radial-gradient(circle,rgba(245,166,35,0.12) 0%,transparent 70%);
  top:-100px;right:-100px;
}
body::after{
  width:300px;height:300px;
  background:radial-gradient(circle,rgba(96,165,250,0.08) 0%,transparent 70%);
  bottom:100px;left:-80px;
}

/* HEADER */
.header{
  flex-shrink:0;
  padding:12px 16px 10px;
  display:flex;align-items:center;gap:10px;
  z-index:10;
  position:relative;
}
.header .logo{
  font-family:'Unbounded',sans-serif;
  font-size:16px;font-weight:700;
  color:var(--accent);
  flex-shrink:0;
}
.manager-select{
  flex:1;
  background:var(--glass);
  border:1px solid var(--glass-border);
  color:var(--text);
  border-radius:10px;
  padding:6px 10px;
  font-family:'Manrope',sans-serif;
  font-size:13px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  outline:none;
}
.sync-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--green);flex-shrink:0;
  transition:background 0.3s;
}

/* SCROLL AREA */
.pages-wrap{
  flex:1;
  overflow:hidden;
  position:relative;
  z-index:1;
}
.page{
  display:none;
  height:100%;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:0 14px calc(var(--nav-h) + var(--safe-bottom) + 16px);
}
.page.active{display:block;}

/* BOTTOM NAV */
.bottom-nav{
  flex-shrink:0;
  position:relative;z-index:20;
  padding:0 8px calc(var(--safe-bottom));
}
.bottom-nav-inner{
  display:flex;
  border-radius:18px;
  overflow:hidden;
  background:rgba(15,15,20,0.7);
  backdrop-filter:blur(32px) saturate(200%);
  -webkit-backdrop-filter:blur(32px) saturate(200%);
  border:1px solid rgba(255,255,255,0.1);
  margin:8px 0;
}
.nav-btn{
  flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;
  padding:10px 4px;
  background:none;border:none;
  color:var(--text3);
  cursor:pointer;
  transition:color 0.2s;
  font-family:'Manrope',sans-serif;
  font-size:10px;
  position:relative;
}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform 0.2s;}
.nav-btn.active{color:var(--accent);}
.nav-btn.active svg{transform:scale(1.1);}
.nav-btn:active svg{transform:scale(0.92);}

/* CARDS */
.card{
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--glass-border);
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
}
.card-title{
  font-size:11px;color:var(--text3);
  text-transform:uppercase;letter-spacing:1px;font-weight:600;
  margin-bottom:12px;
}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-card{
  background:var(--glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);
  border-radius:14px;padding:14px 12px;
}
.stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;font-weight:600;}
.stat-val{font-family:'Unbounded',sans-serif;font-size:18px;font-weight:600;line-height:1.1;}
.stat-sub{font-size:11px;color:var(--text2);margin-top:4px;}
.c-accent .stat-val{color:var(--accent);}
.c-green .stat-val{color:var(--green);}
.c-blue .stat-val{color:var(--blue);}
.c-purple .stat-val{color:var(--purple);}

/* FORM */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.field label{font-size:11px;color:var(--text2);font-weight:600;letter-spacing:0.3px;}
.field input,.field select,.field textarea{
  background:var(--glass-strong);
  border:1px solid var(--glass-border);
  color:var(--text);
  border-radius:10px;
  padding:10px 12px;
  font-family:'Manrope',sans-serif;
  font-size:14px;
  outline:none;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:border-color 0.2s;
  width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(245,166,35,0.6);}
.field textarea{resize:vertical;min-height:60px;}
select option{background:#1a1a2e;}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 20px;border-radius:12px;
  font-family:'Manrope',sans-serif;font-size:14px;font-weight:600;
  cursor:pointer;border:none;transition:all 0.15s;
  width:100%;
}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#000;
  box-shadow:0 4px 20px rgba(245,166,35,0.3);
}
.btn-primary:active{transform:scale(0.97);}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
.btn-ghost{
  background:var(--glass-strong);
  color:var(--text2);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.btn-ghost:active{transform:scale(0.97);}
.btn-danger{
  background:rgba(239,68,68,0.15);color:var(--red);
  border:1px solid rgba(239,68,68,0.3);
}

/* PRODUCTS GRID */
.products-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.product-card{
  background:var(--glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);
  border-radius:14px;overflow:hidden;
}
.product-img{width:100%;height:130px;background:var(--glass-strong);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:12px;overflow:hidden;}
.product-img img{width:100%;height:100%;object-fit:cover;}
.product-body{padding:10px;}
.product-name{font-weight:600;font-size:13px;margin-bottom:2px;line-height:1.3;}
.product-price{color:var(--accent);font-family:'Unbounded',sans-serif;font-size:11px;margin-bottom:8px;}
.product-sizes{display:flex;flex-wrap:wrap;gap:3px;}
.size-badge{padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;}
.size-badge.in{background:rgba(34,197,94,0.15);color:var(--green);border:1px solid rgba(34,197,94,0.25);}
.size-badge.out{background:rgba(239,68,68,0.08);color:rgba(239,68,68,0.4);border:1px solid rgba(239,68,68,0.15);text-decoration:line-through;}

/* CHART */
.bar-chart{display:flex;align-items:flex-end;gap:5px;height:100px;}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;}
.bar{width:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:4px 4px 0 0;min-height:3px;opacity:0.85;}
.bar-label{font-size:9px;color:var(--text3);}
.bar-val{font-size:9px;color:var(--text2);font-weight:600;}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--glass-border);}
table{width:100%;border-collapse:collapse;}
th{background:rgba(255,255,255,0.04);color:var(--text3);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.7px;padding:10px 12px;text-align:left;white-space:nowrap;}
td{padding:10px 12px;border-top:1px solid rgba(255,255,255,0.05);font-size:12px;vertical-align:top;}
tr:hover td{background:rgba(255,255,255,0.02);}

/* BADGES */
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:600;}
.badge-cash{background:rgba(34,197,94,0.12);color:var(--green);}
.badge-card{background:rgba(96,165,250,0.12);color:var(--blue);}
.badge-return{background:rgba(239,68,68,0.12);color:var(--red);border:1px solid rgba(239,68,68,0.2);}
.returned-row td{opacity:0.4;text-decoration:line-through;}
.tag-manager{display:inline-flex;align-items:center;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;background:rgba(192,132,252,0.12);color:var(--purple);}

/* SIZES ROW */
.sizes-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.size-item{display:flex;align-items:center;gap:5px;background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:8px;padding:5px 8px;}
.size-item span{font-size:12px;font-weight:600;color:var(--accent);min-width:24px;}
.size-item input{width:46px;background:var(--glass);border:1px solid var(--glass-border);color:var(--text);border-radius:6px;padding:3px 6px;font-size:12px;font-family:'Manrope',sans-serif;text-align:center;outline:none;}

/* PHOTO */
.photo-label{display:block;cursor:pointer;}
.photo-label input[type=file]{width:0.1px;height:0.1px;opacity:0;overflow:hidden;position:absolute;z-index:-1;}
.photo-box{width:100%;height:130px;background:var(--glass-strong);border:2px dashed var(--glass-border);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;position:relative;}
.photo-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.ph-icon{font-size:24px;} .ph-text{font-size:12px;color:var(--text2);text-align:center;padding:0 12px;} .ph-sub{font-size:10px;color:var(--text3);}

/* MODAL */
.modal-bg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:9999;align-items:flex-end;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{
  background:rgba(18,18,28,0.95);
  backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:24px 24px 0 0;
  padding:20px 16px calc(var(--safe-bottom) + 20px);
  width:100%;max-width:500px;
  max-height:88vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.modal-handle{width:36px;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;margin:0 auto 18px;}
.modal-title{font-family:'Unbounded',sans-serif;font-size:14px;font-weight:600;margin-bottom:16px;}

/* CART */
.cart-item{
  display:flex;align-items:center;gap:10px;
  background:var(--glass);border:1px solid var(--glass-border);
  border-radius:12px;padding:10px 12px;margin-bottom:8px;
}
.cart-item-info{flex:1;}
.cart-item-name{font-size:13px;font-weight:600;}
.cart-item-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.cart-item-price{font-family:'Unbounded',sans-serif;font-size:12px;color:var(--accent);}
.btn-remove{background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;padding:4px;opacity:0.7;}

/* FILTER ROW */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.filter-row input,.filter-row select{
  background:var(--glass-strong);border:1px solid var(--glass-border);
  color:var(--text);border-radius:10px;padding:8px 10px;
  font-family:'Manrope',sans-serif;font-size:12px;outline:none;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  flex:1;min-width:100px;
}

/* MISC */
.section-title{font-family:'Unbounded',sans-serif;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;margin-top:4px;}
.divider{height:1px;background:rgba(255,255,255,0.07);margin:14px 0;}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px;}
.loading{text-align:center;padding:30px;color:var(--text3);font-size:13px;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.15);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin-right:6px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
.alert{padding:10px 14px;border-radius:10px;font-size:12px;margin-bottom:10px;display:none;}
.alert.show{display:block;}
.alert-success{background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3);color:var(--green);}
.alert-error{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);color:var(--red);}
.prog-wrap{height:3px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:4px;overflow:hidden;display:none;}
.prog-bar{height:100%;background:var(--accent);border-radius:2px;transition:width 0.3s;width:0%;}
.row-between{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.btn-return{background:rgba(239,68,68,0.1);color:var(--red);border:1px solid rgba(239,68,68,0.25);font-size:10px;padding:4px 8px;border-radius:6px;cursor:pointer;font-family:'Manrope',sans-serif;font-weight:600;white-space:nowrap;}

/* BIG AMOUNT INPUT */
.amount-input-wrap{
  background:var(--glass-strong);
  border:2px solid rgba(245,166,35,0.5);
  border-radius:14px;padding:14px 16px;margin-bottom:12px;
}
.amount-input-wrap label{font-size:11px;color:var(--accent);font-weight:600;letter-spacing:0.3px;display:block;margin-bottom:6px;}
.amount-input-wrap input{
  background:none;border:none;color:var(--text);
  font-family:'Unbounded',sans-serif;font-size:24px;font-weight:600;
  width:100%;outline:none;
}
.discount-line{font-size:12px;color:var(--red);margin-top:6px;}

::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header glass">
  <div class="logo">YAMAL</div>
  <select class="manager-select" id="currentManager">
    <option>Алуа</option><option>Алиш</option><option>Бека</option><option>Рома</option>
  </select>
  <div class="sync-dot" id="sync-dot" title=""></div>
</div>

<!-- PAGES -->
<div class="pages-wrap">

  <!-- DASHBOARD -->
  <div class="page active" id="page-dashboard">
    <div style="height:12px;"></div>
    <div id="dash-stats" class="stats-grid"><div class="loading" style="grid-column:span 2;"><span class="spinner"></span>Загрузка...</div></div>
    <div class="section-title">7 дней</div>
    <div class="card" style="padding:14px 12px 10px;">
      <div class="bar-chart" id="week-chart"></div>
    </div>
    <div class="section-title">Последние продажи</div>
    <div id="dash-recent"></div>
    <div style="height:4px;"></div>
  </div>

  <!-- PRODUCTS -->
  <div class="page" id="page-products">
    <div style="height:12px;"></div>
    <div class="row-between">
      <div class="section-title" style="margin-bottom:0;">Склад</div>
      <button class="btn btn-primary" style="width:auto;padding:8px 14px;font-size:12px;" onclick="openAddProduct()">+ Добавить</button>
    </div>
    <div id="alert-products" class="alert" style="margin-top:8px;"></div>
    <div style="margin-bottom:10px;"><input id="search-products" type="text" placeholder="Поиск..." oninput="renderProducts()" style="width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:var(--text);border-radius:10px;padding:9px 12px;font-family:'Manrope',sans-serif;font-size:13px;outline:none;backdrop-filter:blur(12px);"></div>
    <div id="products-grid" class="products-grid"><div class="loading" style="grid-column:span 2;"><span class="spinner"></span>Загрузка...</div></div>
  </div>

  <!-- SALE -->
  <div class="page" id="page-sale">
    <div style="height:12px;"></div>
    <div id="alert-sale" class="alert"></div>

    <div class="card">
      <div class="card-title">Добавить в корзину</div>
      <div class="field">
        <label>Товар</label>
        <select id="sale-product" onchange="onSaleProductChange()"><option value="">— выберите товар —</option></select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="field">
          <label>Размер</label>
          <select id="sale-size" onchange="onSaleSizeChange()"><option value="">— размер —</option></select>
        </div>
        <div class="field">
          <label>Кол-во</label>
          <input type="number" id="sale-qty" min="1" value="1" inputmode="numeric">
        </div>
      </div>
      <div class="field">
        <label>В наличии: <span id="sale-stock" style="color:var(--green);">—</span></label>
      </div>
      <button class="btn btn-ghost" onclick="addToCart()" style="margin-top:4px;">+ В корзину</button>
    </div>

    <div class="card">
      <div class="card-title">Корзина</div>
      <div id="cart-items"><div style="color:var(--text3);font-size:13px;text-align:center;padding:12px 0;">Пусто — добавьте товары выше</div></div>

      <div id="cart-summary" style="display:none;">
        <div class="divider"></div>
        <div class="amount-input-wrap">
          <label>💰 Сумма оплаты (₸) *</label>
          <input type="number" id="sale-actual-price" placeholder="0" oninput="updateActualPrice()" inputmode="numeric">
        </div>
        <div id="discount-line" class="discount-line" style="display:none;"></div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:12px;">По прайсу: <span id="cart-price-total" style="color:var(--text);font-weight:600;"></span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Клиент (необязательно)</div>
      <div class="field"><label>Имя</label><input type="text" id="sale-name" placeholder="Алибек"></div>
      <div class="field"><label>Телефон</label><input type="text" id="sale-phone" placeholder="+7 777 ..."></div>
      <div class="field"><label>Адрес</label><input type="text" id="sale-address" placeholder="г. Алматы, ул. Абая 10"></div>
      <div class="field"><label>Оплата</label>
        <select id="sale-payment"><option value="Наличные">💵 Наличные</option><option value="Карта">💳 Карта</option></select>
      </div>
      <div class="field"><label>Примечание</label><input type="text" id="sale-note" placeholder="..."></div>
    </div>

    <button class="btn btn-primary" id="btn-sale" onclick="recordSale()" style="margin-bottom:8px;">✓ Зафиксировать продажу</button>
  </div>

  <!-- HISTORY -->
  <div class="page" id="page-history">
    <div style="height:12px;"></div>
    <div class="row-between">
      <div class="section-title" style="margin-bottom:0;">История</div>
      <div id="history-total-label" style="font-size:12px;color:var(--text2);"></div>
    </div>
    <div id="history-alert" class="alert"></div>
    <div class="filter-row">
      <input type="date" id="filter-date-from" oninput="renderHistory()">
      <input type="date" id="filter-date-to" oninput="renderHistory()">
    </div>
    <div class="filter-row">
      <select id="filter-manager" onchange="renderHistory()" style="flex:1;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:var(--text);border-radius:10px;padding:8px 10px;font-family:'Manrope',sans-serif;font-size:12px;outline:none;">

<script>
const SUPABASE_URL='https://jincncnidqowqcepvsbh.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppbmNuY25pZHFvd3FjZXB2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MDUxMTUsImV4cCI6MjA5NTQ4MTExNX0.tIbCVm85yj7iq4VdEOzSZWdGl4n-8EYyx6N0_bZ7q6I';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const SIZES=['XS','S','M','L','XL','2XL','3XL'];
let products=[],sales=[],cart=[];

const CACHE_KEY_P='cache_products_v2';
const CACHE_KEY_S='cache_sales_v2';
const CACHE_TTL=5*60*1000;

function saveCache(key,data){try{localStorage.setItem(key,JSON.stringify({data,ts:Date.now()}));}catch(e){}}
function loadCache(key){try{const r=localStorage.getItem(key);if(!r)return null;const{data,ts}=JSON.parse(r);if(Date.now()-ts>CACHE_TTL)return null;return data;}catch{return null;}}

function setSyncStatus(ok){
  const dot=document.getElementById('sync-dot');
  dot.style.background=ok===null?'var(--accent)':ok?'var(--green)':'var(--red)';
}

async function init(){
  setSyncStatus(null);
  const cp=loadCache(CACHE_KEY_P),cs=loadCache(CACHE_KEY_S);
  if(cp&&cs){products=cp;sales=cs;renderAll();}
  try{
    const[pr,sa]=await Promise.all([
      sb.from('products').select('*').order('created_at'),
      sb.from('sales').select('*').order('ts',{ascending:false})
    ]);
    if(pr.error)throw pr.error;if(sa.error)throw sa.error;
    products=pr.data||[];sales=sa.data||[];
    saveCache(CACHE_KEY_P,products);saveCache(CACHE_KEY_S,sales);
    setSyncStatus(true);renderAll();
  }catch(e){setSyncStatus(false);if(!cp)console.error(e);}
}

function renderAll(){renderDashboard();renderProducts();renderHistory();renderClients();populateSaleProduct();}

function showPage(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  if(btn)btn.classList.add('active');
  if(id==='sale')populateSaleProduct();
  if(id==='dashboard')renderDashboard();
}

function onPhotoChange(input,boxId){
  const file=input.files[0];if(!file)return;
  const box=document.getElementById(boxId);
  const reader=new FileReader();
  reader.onload=e=>{
    let img=box.querySelector('img');
    if(!img){img=document.createElement('img');box.prepend(img);}
    img.src=e.target.result;
    box.querySelectorAll('.ph-icon,.ph-text,.ph-sub').forEach(el=>el.style.display='none');
  };
  reader.readAsDataURL(file);
}

async function uploadPhoto(file,barId,wrapId){
  if(!file)return null;
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  const path='products/'+Date.now()+Math.random().toString(36).slice(2)+'.'+ext;
  document.getElementById(wrapId).style.display='block';
  document.getElementById(barId).style.width='40%';
  const{data,error}=await sb.storage.from('product-images').upload(path,file,{cacheControl:'3600',upsert:true});
  document.getElementById(barId).style.width='100%';
  setTimeout(()=>{document.getElementById(wrapId).style.display='none';document.getElementById(barId).style.width='0%';},700);
  if(error){alert('Ошибка загрузки фото: '+error.message);return null;}
  const{data:urlData}=sb.storage.from('product-images').getPublicUrl(path);
  return urlData.publicUrl;
}

function resetBox(boxId,inputId){
  const box=document.getElementById(boxId);
  const img=box.querySelector('img');if(img)img.remove();
  box.querySelectorAll('.ph-icon,.ph-text,.ph-sub').forEach(el=>el.style.display='');
  document.getElementById(inputId).value='';
}

function renderDashboard(){
  const today=todayStr(),tm=today.slice(0,7);
  const tS=sales.filter(s=>s.sale_date===today&&!s.is_return);
  const mS=sales.filter(s=>s.sale_date&&s.sale_date.startsWith(tm)&&!s.is_return);
  const tR=tS.reduce((a,s)=>a+s.total,0),mR=mS.reduce((a,s)=>a+s.total,0),aR=sales.filter(s=>!s.is_return).reduce((a,s)=>a+s.total,0);
  const stk=products.reduce((a,p)=>a+Object.values(p.sizes||{}).reduce((x,y)=>x+y,0),0);
  const returnCount=sales.filter(s=>s.is_return).length;
  document.getElementById('dash-stats').innerHTML=`
    <div class="stat-card c-accent"><div class="stat-label">Сегодня</div><div class="stat-val">${fmt(tR)} ₸</div><div class="stat-sub">${tS.length} продаж</div></div>
    <div class="stat-card c-green"><div class="stat-label">Месяц</div><div class="stat-val">${fmt(mR)} ₸</div><div class="stat-sub">${mS.length} продаж</div></div>
    <div class="stat-card c-blue"><div class="stat-label">Всего</div><div class="stat-val">${fmt(aR)} ₸</div><div class="stat-sub">${sales.filter(s=>!s.is_return).length} прод${returnCount>0?" · "+returnCount+" возвр":""}</div></div>
    <div class="stat-card c-purple"><div class="stat-label">В наличии</div><div class="stat-val">${stk}</div><div class="stat-sub">${products.length} позиций</div></div>`;
  const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d.toISOString().slice(0,10);});
  const vals=days.map(d=>sales.filter(s=>s.sale_date===d&&!s.is_return).reduce((a,s)=>a+s.total,0));
  const mx=Math.max(...vals,1);
  document.getElementById('week-chart').innerHTML=days.map((d,i)=>`<div class="bar-col"><div class="bar-val">${vals[i]>0?(vals[i]>=1000?Math.round(vals[i]/1000)+'k':vals[i]):''}</div><div class="bar" style="height:${Math.max(Math.round(vals[i]/mx*100),3)}%"></div><div class="bar-label">${d.slice(5)}</div></div>`).join('');
  const recent=sales.filter(s=>!s.is_return).slice(0,6);
  document.getElementById('dash-recent').innerHTML=recent.length?recentHTML(recent):'<div class="empty">Продаж ещё нет</div>';
}

function recentHTML(list){
  return list.map(s=>`
    <div class="card" style="padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;">
      <div style="flex:1;min-width:0;">
        <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${s.product_name} <span style="color:var(--accent);font-size:11px;">${s.size}</span></div>
        <div style="font-size:11px;color:var(--text2);margin-top:2px;">${s.sale_date||''} · ${s.manager||''} · ${s.client_name||s.phone||'—'}</div>
      </div>
      <div style="font-family:'Unbounded',sans-serif;font-size:13px;color:var(--green);white-space:nowrap;">${fmt(s.total)} ₸</div>
    </div>`).join('');
}

function closeModal(){document.getElementById('modal-product').classList.remove('open');}
function closeEditModal(){document.getElementById('modal-edit').classList.remove('open');}

function openAddProduct(){
  SIZES.forEach(s=>document.getElementById('sz-'+s).value=0);
  document.getElementById('p-name').value='';document.getElementById('p-price').value='';
  resetBox('box-add','p-photo');showAlert('alert-modal','','');
  document.getElementById('modal-product').classList.add('open');
}

async function saveProduct(){
  const name=document.getElementById('p-name').value.trim();
  const price=parseFloat(document.getElementById('p-price').value)||0;
  const cat=document.getElementById('p-cat').value;
  if(!name){showAlert('alert-modal','Укажите название','error');return;}
  if(!price){showAlert('alert-modal','Укажите цену','error');return;}
  const sizes={};SIZES.forEach(s=>{sizes[s]=parseInt(document.getElementById('sz-'+s).value)||0;});
  const btn=document.getElementById('btn-add-product');btn.disabled=true;btn.textContent='Сохранение...';
  let img='';
  const file=document.getElementById('p-photo').files[0];
  if(file)img=await uploadPhoto(file,'prog-add','prog-wrap-add')||'';
  const{data,error}=await sb.from('products').insert([{id:Date.now().toString(),name,img,price,cat,sizes}]).select();
  btn.disabled=false;btn.textContent='Сохранить';
  if(error){showAlert('alert-modal','Ошибка: '+error.message,'error');return;}
  products.push(data[0]);saveCache(CACHE_KEY_P,products);
  closeModal();renderProducts();renderDashboard();
  showAlert('alert-products','✓ Товар добавлен','success');
}

function renderProducts(){
  const q=(document.getElementById('search-products').value||'').toLowerCase();
  const fl=products.filter(p=>p.name.toLowerCase().includes(q));
  const grid=document.getElementById('products-grid');
  if(!fl.length){grid.innerHTML='<div class="empty" style="grid-column:span 2;">Нет товаров</div>';return;}
  grid.innerHTML=fl.map(p=>{
    const bdg=SIZES.map(s=>{const qty=(p.sizes||{})[s]||0;return`<span class="size-badge ${qty>0?'in':'out'}">${s}:${qty}</span>`;}).join('');
    const imgH=p.img?`<img src="${p.img}" alt="" onerror="this.style.display='none';">`:'<span style="font-size:11px;">Нет фото</span>';
    return`<div class="product-card"><div class="product-img">${imgH}</div><div class="product-body"><div class="product-name">${p.name}</div><div class="product-price">${fmt(p.price)} ₸</div><div class="product-sizes">${bdg}</div><button onclick="openEdit('${p.id}')" style="margin-top:10px;width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:var(--text2);border-radius:8px;padding:7px;font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;cursor:pointer;">✏️ Редактировать</button></div></div>`;
  }).join('');
}

function openEdit(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  document.getElementById('edit-id').value=id;
  document.getElementById('edit-title').textContent=p.name;
  document.getElementById('e-name').value=p.name;
  document.getElementById('e-price').value=p.price;
  document.getElementById('e-img-url').value=p.img||'';
  resetBox('box-edit','e-photo');
  if(p.img){
    const box=document.getElementById('box-edit');
    let img=box.querySelector('img');if(!img){img=document.createElement('img');box.prepend(img);}
    img.src=p.img;
    box.querySelectorAll('.ph-icon,.ph-text,.ph-sub').forEach(el=>el.style.display='none');
  }
  document.getElementById('edit-sizes').innerHTML=SIZES.map(s=>`<div class="size-item"><span>${s}</span><input type="number" id="es-${s}" value="${(p.sizes||{})[s]||0}" min="0" inputmode="numeric"></div>`).join('');
  document.getElementById('modal-edit').classList.add('open');
}

async function saveEdit(){
  const id=document.getElementById('edit-id').value;
  const name=document.getElementById('e-name').value.trim();
  const price=parseFloat(document.getElementById('e-price').value)||0;
  const sizes={};SIZES.forEach(s=>{sizes[s]=parseInt(document.getElementById('es-'+s).value)||0;});
  let img=document.getElementById('e-img-url').value;
  const file=document.getElementById('e-photo').files[0];
  if(file)img=await uploadPhoto(file,'prog-edit','prog-wrap-edit')||img;
  const{error}=await sb.from('products').update({name,img,price,sizes}).eq('id',id);
  if(error){alert('Ошибка: '+error.message);return;}
  const i=products.findIndex(x=>x.id===id);
  if(i!==-1)products[i]={...products[i],name,img,price,sizes};
  saveCache(CACHE_KEY_P,products);
  closeEditModal();renderProducts();renderDashboard();populateSaleProduct();
}

async function deleteProduct(){
  const id=document.getElementById('edit-id').value;
  if(!confirm('Удалить этот товар?'))return;
  const{error}=await sb.from('products').delete().eq('id',id);
  if(error){alert('Ошибка: '+error.message);return;}
  products=products.filter(x=>x.id!==id);
  saveCache(CACHE_KEY_P,products);
  closeEditModal();renderProducts();renderDashboard();
}

function populateSaleProduct(){
  const sel=document.getElementById('sale-product'),cur=sel.value;
  sel.innerHTML='<option value="">— выберите товар —</option>';
  products.forEach(p=>{if(Object.values(p.sizes||{}).reduce((a,b)=>a+b,0)>0)sel.innerHTML+=`<option value="${p.id}">${p.name} — ${fmt(p.price)} ₸</option>`;});
  if(cur)sel.value=cur;
  onSaleProductChange();
}

function onSaleProductChange(){
  const pid=document.getElementById('sale-product').value,ss=document.getElementById('sale-size');
  ss.innerHTML='<option value="">— размер —</option>';
  document.getElementById('sale-stock').textContent='—';
  if(!pid)return;
  const p=products.find(x=>x.id===pid);if(!p)return;
  SIZES.forEach(s=>{const q=(p.sizes||{})[s]||0;if(q>0)ss.innerHTML+=`<option value="${s}">${s} — ${q} шт.</option>`;});
  onSaleSizeChange();
}

function onSaleSizeChange(){
  const pid=document.getElementById('sale-product').value,size=document.getElementById('sale-size').value;
  if(!pid||!size){document.getElementById('sale-stock').textContent='—';return;}
  const p=products.find(x=>x.id===pid);if(!p)return;
  document.getElementById('sale-stock').textContent=((p.sizes||{})[size]||0)+' шт.';
}

function addToCart(){
  const pid=document.getElementById('sale-product').value;
  const size=document.getElementById('sale-size').value;
  const qty=parseInt(document.getElementById('sale-qty').value)||0;
  if(!pid){showAlert('alert-sale','Выберите товар','error');return;}
  if(!size){showAlert('alert-sale','Выберите размер','error');return;}
  if(qty<=0){showAlert('alert-sale','Укажите количество','error');return;}
  const p=products.find(x=>x.id===pid);if(!p)return;
  const avail=(p.sizes||{})[size]||0;
  const inCart=cart.filter(c=>c.productId===pid&&c.size===size).reduce((a,c)=>a+c.qty,0);
  if(qty+inCart>avail){showAlert('alert-sale','Недостаточно! В наличии: '+avail+' шт.','error');return;}
  const existing=cart.find(c=>c.productId===pid&&c.size===size);
  if(existing)existing.qty+=qty;
  else cart.push({productId:pid,productName:p.name,size,qty,price:p.price});
  document.getElementById('sale-product').value='';
  document.getElementById('sale-size').innerHTML='<option value="">— размер —</option>';
  document.getElementById('sale-stock').textContent='—';
  document.getElementById('sale-qty').value='1';
  renderCart();showAlert('alert-sale','','');
}

function removeFromCart(idx){cart.splice(idx,1);renderCart();}

function renderCart(){
  const el=document.getElementById('cart-items');
  const summary=document.getElementById('cart-summary');
  if(!cart.length){
    el.innerHTML='<div style="color:var(--text3);font-size:13px;text-align:center;padding:12px 0;">Пусто — добавьте товары выше</div>';
    summary.style.display='none';return;
  }
  el.innerHTML=cart.map((c,i)=>`
    <div class="cart-item">
      <div class="cart-item-info">
        <div class="cart-item-name">${c.productName}</div>
        <div class="cart-item-sub"><span style="color:var(--accent);font-weight:700;">${c.size}</span> · ${c.qty} шт.</div>
      </div>
      <div class="cart-item-price">${fmt(c.price*c.qty)} ₸</div>
      <button class="btn-remove" onclick="removeFromCart(${i})">✕</button>
    </div>`).join('');
  summary.style.display='block';
  const priceTotal=cart.reduce((a,c)=>a+c.price*c.qty,0);
  document.getElementById('cart-price-total').textContent=fmt(priceTotal)+' ₸';
  const ap=document.getElementById('sale-actual-price');
  if(!ap.value)ap.value=priceTotal;
  updateActualPrice();
}

function updateActualPrice(){
  const priceTotal=cart.reduce((a,c)=>a+c.price*c.qty,0);
  const actual=parseFloat(document.getElementById('sale-actual-price').value)||0;
  const dl=document.getElementById('discount-line');
  if(actual>0&&actual<priceTotal){
    const disc=priceTotal-actual;
    dl.style.display='block';
    dl.textContent='Скидка: −'+fmt(disc)+' ₸ ('+Math.round(disc/priceTotal*100)+'%)';
  }else{dl.style.display='none';}
}

async function recordSale(){
  if(!cart.length){showAlert('alert-sale','Добавьте товары в корзину','error');return;}
  const actualPrice=parseFloat(document.getElementById('sale-actual-price').value)||0;
  if(!actualPrice){showAlert('alert-sale','Укажите сумму оплаты','error');return;}
  const phone=document.getElementById('sale-phone').value.trim();
  const address=document.getElementById('sale-address').value.trim();
  const payment=document.getElementById('sale-payment').value;
  const clientName=document.getElementById('sale-name').value.trim();
  const note=document.getElementById('sale-note').value.trim();
  const manager=document.getElementById('currentManager').value;
  const btn=document.getElementById('btn-sale');
  btn.disabled=true;btn.textContent='Сохранение...';
  const priceTotal=cart.reduce((a,c)=>a+c.price*c.qty,0);
  const now=new Date();
  const groupId='grp_'+Date.now();
  const salesToInsert=[];
  for(const item of cart){
    const pi=products.findIndex(x=>x.id===item.productId);if(pi===-1)continue;
    const newSizes={...products[pi].sizes};
    newSizes[item.size]=(newSizes[item.size]||0)-item.qty;
    const{error:pe}=await sb.from('products').update({sizes:newSizes}).eq('id',item.productId);
    if(pe){showAlert('alert-sale','Ошибка склада: '+pe.message,'error');btn.disabled=false;btn.textContent='✓ Зафиксировать продажу';return;}
    products[pi].sizes=newSizes;
    const itemShare=priceTotal>0?(item.price*item.qty/priceTotal):1;
    const itemActual=Math.round(actualPrice*itemShare);
    salesToInsert.push({
      id:Date.now().toString()+'_'+Math.random().toString(36).slice(2),
      product_id:item.productId,product_name:item.productName,
      size:item.size,qty:item.qty,price:item.price,
      total:itemActual,price_original:item.price*item.qty,
      phone:phone||'',address:address||'',payment,client_name:clientName,note,manager,
      sale_date:todayStr(),
      sale_time:new Date(now.getTime()+5*60*60*1000).toISOString().slice(11,16),
      ts:now.getTime(),group_id:groupId
    });
  }
  const{data:sd,error:se}=await sb.from('sales').insert(salesToInsert).select();
  btn.disabled=false;btn.textContent='✓ Зафиксировать продажу';
  if(se){showAlert('alert-sale','Ошибка: '+se.message,'error');return;}
  sd.forEach(s=>sales.unshift(s));
  saveCache(CACHE_KEY_P,products);saveCache(CACHE_KEY_S,sales);
  showAlert('alert-sale','✓ Продажа зафиксирована! '+fmt(actualPrice)+' ₸','success');
  cart=[];renderCart();
  ['sale-phone','sale-address','sale-name','sale-note'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('sale-actual-price').value='';
  renderDashboard();renderHistory();renderClients();populateSaleProduct();
}

function renderHistory(){
  const from=document.getElementById('filter-date-from').value,to=document.getElementById('filter-date-to').value,mgr=document.getElementById('filter-manager').value;
  let f=[...sales];
  if(from)f=f.filter(s=>s.sale_date>=from);if(to)f=f.filter(s=>s.sale_date<=to);if(mgr)f=f.filter(s=>s.manager===mgr);
  const total=f.filter(s=>!s.is_return).reduce((a,s)=>a+s.total,0);
  document.getElementById('history-total-label').textContent=f.length+' записей · '+fmt(total)+' ₸';
  if(!f.length){document.getElementById('history-table').innerHTML='<div class="empty">Нет продаж</div>';return;}
  document.getElementById('history-table').innerHTML=`<div class="table-wrap"><table>
    <thead><tr><th>Дата</th><th>Товар</th><th>Р-р</th><th>Сумма</th><th>Клиент</th><th>Менеджер</th><th></th></tr></thead>
    <tbody>`+f.map(s=>{
    const isReturn=s.is_return===true||s.is_return==='true';
    return`<tr class="${isReturn?'returned-row':''}">
      <td style="white-space:nowrap;color:var(--text2);font-size:11px;">${s.sale_date||''}<br>${s.sale_time||''}</td>
      <td><strong style="font-size:12px;">${s.product_name}</strong></td>
      <td><span style="color:var(--accent);font-weight:700;font-size:12px;">${s.size}</span></td>
      <td style="font-family:'Unbounded',sans-serif;font-size:12px;color:${isReturn?'var(--red)':'var(--green)'};white-space:nowrap;">${isReturn?'−':''}${fmt(s.total)} ₸</td>
      <td style="font-size:11px;color:var(--text2);">${s.client_name||s.phone||'—'}</td>
      <td><span class="tag-manager">${s.manager||'—'}</span></td>
      <td>${!isReturn?`<button class="btn-return" onclick="confirmReturn('${s.id}')">↩</button>`:''}</td>
    </tr>`;
  }).join('')+'</tbody></table></div>';
}

function clearFilters(){['filter-date-from','filter-date-to','filter-manager'].forEach(id=>document.getElementById(id).value='');renderHistory();}

function renderClients(){
  const q=(document.getElementById('search-clients').value||'').toLowerCase();
  const map={};
  sales.forEach(s=>{const k=s.phone||s.client_name||'unknown';if(!map[k])map[k]={phone:s.phone,name:s.client_name||'',count:0,total:0,last:''};map[k].count++;map[k].total+=s.is_return?0:s.total;if(!map[k].last||s.sale_date>map[k].last){map[k].last=s.sale_date;if(s.client_name)map[k].name=s.client_name;}});
  let list=Object.values(map).sort((a,b)=>b.total-a.total);
  if(q)list=list.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.phone||'').includes(q));
  if(!list.length){document.getElementById('clients-table').innerHTML='<div class="empty">Клиентов пока нет</div>';return;}
  document.getElementById('clients-table').innerHTML=list.map(c=>`
    <div class="card" style="padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;">
      <div style="width:38px;height:38px;border-radius:50%;background:rgba(245,166,35,0.15);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--accent);flex-shrink:0;">${(c.name||c.phone||'?').slice(0,1).toUpperCase()}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:600;font-size:13px;">${c.name||'—'}</div>
        <div style="font-size:11px;color:var(--blue);">${c.phone||''}</div>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <div style="font-family:'Unbounded',sans-serif;font-size:12px;color:var(--accent);">${fmt(c.total)} ₸</div>
        <div style="font-size:10px;color:var(--text3);">${c.count} покупок</div>
      </div>
    </div>`).join('');
}

async function confirmReturn(saleId){
  if(!confirm('Оформить возврат? Товар вернётся на склад.'))return;
  const s=sales.find(x=>x.id===saleId);if(!s)return;
  if(s.is_return){alert('Уже возвращён.');return;}
  const pi=products.findIndex(x=>x.id===s.product_id);
  if(pi!==-1){
    const newSizes={...products[pi].sizes};
    newSizes[s.size]=(newSizes[s.size]||0)+s.qty;
    const{error:pe}=await sb.from('products').update({sizes:newSizes}).eq('id',s.product_id);
    if(pe){alert('Ошибка: '+pe.message);return;}
    products[pi].sizes=newSizes;
  }
  const{error:se}=await sb.from('sales').update({is_return:true}).eq('id',saleId);
  if(se){alert('Ошибка: '+se.message);return;}
  const si=sales.findIndex(x=>x.id===saleId);if(si!==-1)sales[si].is_return=true;
  saveCache(CACHE_KEY_P,products);saveCache(CACHE_KEY_S,sales);
  renderDashboard();renderHistory();renderProducts();populateSaleProduct();
  showAlert('history-alert','✓ Возврат оформлен!','success');
}

function todayStr(){const now=new Date();const alm=new Date(now.getTime()+5*60*60*1000);return alm.toISOString().slice(0,10);}
function fmt(n){return Math.round(n).toLocaleString('ru');}
function showAlert(id,msg,type){const el=document.getElementById(id);el.textContent=msg;el.className='alert show alert-'+type;if(msg)setTimeout(()=>el.classList.remove('show'),4000);}

document.getElementById('modal-product').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.getElementById('modal-edit').addEventListener('click',e=>{if(e.target===e.currentTarget)closeEditModal();});

init();
</script>
